name: CI - Nightly

on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      docker:
        image: docker:20.10.7
        options: --privileged
        ports:
          - 2375:2375
        env:
          DOCKER_TLS_CERTDIR: ""

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run shellcheck
        run: |
          shellcheck trafficjam-functions.sh
          shellcheck -x trafficjam.sh

      - name: Install shfmt
        shell: bash
        run: |
          sudo add-apt-repository ppa:longsleep/golang-backports
          sudo apt install golang-go
          export GOPATH=/usr/local
          sudo -E go install mvdan.cc/sh/v3/cmd/shfmt@latest

      - name: Run shfmt
        run: shfmt --diff trafficjam.sh trafficjam-functions.sh

      - name: Install bats
        run: |
          sudo git clone --depth 1 --branch v1.8.0 https://github.com/bats-core/bats-core.git /opt/bats
          sudo /opt/bats/install.sh /usr/local

      - name: Run test suite
        env:
          DOCKER_HOST: tcp://localhost:2375
        run: bats test/test.bats
